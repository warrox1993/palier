# La base locale du développement. UN SEUL service — D33 : le backend reste sur
# l'hôte, avec `dotnet run`, le débogueur et `dotnet ef` natifs. Pas de
# Dockerfile, pas de compose de production.
#
# Le tag est écrit ICI ET NULLE PART AILLEURS — D34. Le builder Testcontainers
# de la tâche 5 le LIT dans ce fichier au lieu de le redéclarer : deux
# déclarations du même tag divergent, et la divergence se ferme par une lecture,
# jamais par une discipline. `tests-harness/db.test.mjs` parcourt le dépôt pour
# vérifier qu'aucune seconde déclaration n'est apparue.
#
# Pas la variante `alpine`, pour une raison mesurable et non esthétique : musl
# n'implémente pas LC_COLLATE comme glibc, le tri y est octet par octet, et
# l'instance managée tourne sur glibc. Un `ORDER BY` sur un nom d'exercice
# trierait différemment sur le poste et en production — exactement la divergence
# qu'une base locale existe pour supprimer.
#
# Le tag n'est délibérément PAS épinglé par empreinte, contrairement aux actions
# GitHub de D28 : ce conteneur n'exécute rien qui touche au dépôt et ne voit
# aucun secret. Sa mutabilité y est un bénéfice — elle apporte les correctifs.
services:
  palier-db:
    image: postgres:18.6
    # LE NOM EST FIGÉ, et ce n'est pas du confort. Sans `container_name`,
    # Compose engendre `<projet>-<service>-<n>` — `db-palier-db-1` — et
    # `scripts/referentiel.mjs`, qui appelle `docker exec palier-db`, ne trouve
    # jamais sa cible : mesuré le 24/08/2026, « No such container: palier-db ».
    #
    # Le référentiel de production était donc inapplicable sur toute machine, et
    # rien ne le signalait : les épreuves appliquent les `.sql` par Npgsql, un
    # chemin qui ne passe pas par Docker.
    #
    # Le prix de `container_name` est qu'une seule instance peut tourner. Pour
    # une base de développement locale, ce n'est pas un prix.
    container_name: palier-db
    # Le mot de passe local reste EN CLAIR ici, et c'est délibéré : il ne donne
    # accès à rien d'autre qu'à un conteneur vide sur la machine, et gitleaks
    # l'accepte sous cette forme — mesuré le 20/08/2026.
    #
    # Ce qui est refusé, c'est une chaîne de connexion COMPLÈTE dans un fichier
    # de code : la règle `chaine-connexion-postgres` de `.gitleaks.regles.toml`
    # la reconnaît, et elle mord. Ces chaînes vont en `dotnet user-secrets` ou
    # en variable d'environnement, jamais dans `appsettings.Development.json`.
    #
    # Le motif exact n'est PAS recopié ici : écrit en toutes lettres dans ce
    # commentaire, il déclenchait la règle sur ce fichier même — mesuré, et
    # corrigé en retirant le motif plutôt qu'en élargissant l'exception, qui
    # aurait rendu la règle aveugle sur tout le dossier.
    environment:
      POSTGRES_USER: palier_admin
      POSTGRES_PASSWORD: motdepasse_local_sans_valeur
      POSTGRES_DB: palier
      # Collation ICU en `fr-BE`, et non le provider `libc` par défaut — D44.
      #
      # Le tri lui-même ne change PAS : mesuré le 20/08/2026, `en_US.utf8` sous
      # glibc et `fr-BE` sous ICU rendent le même ordre sur
      # « eau < Éclair < élan < Ève < œuf < zèbre ». La glibc applique ISO 14651,
      # qui gère déjà les accents, la casse et la ligature « œ ».
      #
      # Ce qui change est la STABILITÉ de ce tri d'un environnement à l'autre.
      # Sous `libc`, `datcollversion` est la version de la glibc de l'image —
      # 2.41 ici. Elle bouge avec l'image de base, avec une mise à jour du socle
      # OVHcloud, avec un passage de Debian 13 à 14. Et un changement d'ordre de
      # tri INVALIDE les index sur les colonnes texte, ce que PostgreSQL ne
      # signale que par un avertissement au démarrage que personne ne lit.
      # Sous ICU, la version est celle de la bibliothèque — 153.128 — versionnée
      # indépendamment du système, et la locale est inscrite DANS la base
      # (`datlocale`) au lieu d'être héritée d'une variable d'environnement.
      #
      # Troisième effet, plus prosaïque : `en_US.utf8` doit EXISTER dans l'image.
      # ICU n'a pas cette dépendance.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=fr-BE --encoding=UTF8
    # Bornée à la boucle locale, et non au `0.0.0.0` que Compose prend par
    # défaut — D83. Les mots de passe de `amorcage/` sont écrits en clair dans
    # le dépôt : publiée sur toutes les interfaces, la base était joignable
    # depuis le réseau local avec des identifiants que n'importe qui peut lire
    # sur GitHub. Même règle que l'attrape-courriel de `compose.outils.yaml`.
    #
    # Le port reste 5432 par défaut. La démonstration de la racine, qui étend
    # ce service au lieu de redéclarer son tag (D34), le déplace par
    # `PALIER_PORT_BASE` pour ne pas heurter une base de développement levée.
    ports:
      - '127.0.0.1:${PALIER_PORT_BASE:-5432}:5432'
    # Le montage est sur `/var/lib/postgresql`, PAS sur son sous-dossier
    # `/data`. PostgreSQL 18 a changé cette convention : monter directement sur
    # `/data` fait refuser le démarrage — « There appears to be PostgreSQL data
    # in /var/lib/postgresql/data (unused mount/volume) », mesuré au premier
    # lancement réel, le conteneur démarrant puis s'arrêtant aussitôt.
    # L'image place désormais les données dans un sous-dossier du montage, ce
    # qui permet `pg_upgrade --link` sans franchir de frontière de montage.
    volumes:
      - palier-db-data:/var/lib/postgresql
      # `amorcage/` est monté en LECTURE SEULE dans le répertoire d'amorçage de
      # l'image : l'entrypoint y exécute les `*.sql` par ordre alphabétique,
      # sous le compte d'administration, avant que la base accepte la moindre
      # connexion. C'est ainsi que les trois rôles de D37 existent avant que
      # `dotnet ef database update` s'y connecte.
      #
      # AJOUTÉ À LA TÂCHE 6, ET C'EST UN DÉFAUT DU PLAN CORRIGÉ, PAS UNE
      # AMÉLIORATION. L'étape 7 de la tâche 6 demandait d'appliquer la migration
      # « sans aucune commande manuelle intercalée » sur la base levée par
      # `npm run db:up` — mesuré le 20/08/2026, elle ne portait que
      # `palier_admin`, et la migration échouait sur un rôle inexistant. Aucune
      # tâche du lot ne montait ce dossier.
      #
      # L'entrypoint n'exécute ces fichiers QUE si le répertoire de données est
      # vide. Sur un volume déjà créé, il faut `npm run db:reset` — qui détruit
      # les données locales — puis `npm run db:up`. C'est écrit dans
      # `db/README.md` § Appliquer, parce que le symptôme (« le rôle
      # palier_migrations n'existe pas ») ne dit pas le remède.
      - ./amorcage:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U palier_admin -d palier']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  palier-db-data:
