# Gardien de `main` — l'alarme qui complète la protection de branche.
#
# GitHub Free n'autorise les règles de dépôt (protection de branche classique
# ET rulesets) que sur les dépôts PUBLICS. Vérifié le 20/08/2026 : les deux API
# rendaient « Upgrade to GitHub Pro or make this repository public », en HTTP
# 403, avec des droits d'administration pleins. `palier` était privé (D29).
#
# Il est PUBLIC depuis le 28/09/2026 (D84), et une barrière côté serveur existe
# depuis le même jour : le ruleset « Protection de la branche par défaut »
# (id 24111580) interdit le push direct et le force-push sur `main`, exige une
# pull request fusionnée en squash, un historique linéaire, et les six checks
# `front`, `backend`, `securite`, `e2e`, `performance`, `franchissement` au
# vert. Vérifié : un push direct est refusé (GH013), une fusion est refusée tant
# que la CI tourne. Seul l'administrateur peut contourner, et seulement par une
# fusion de pull request explicitement forcée (`--admin`).
#
# Ce gardien reste en place, parce qu'une règle de branche empêche une fusion
# ROUGE, pas une `main` qui devient rouge sans fusion : une action, une image,
# une dépendance ou un service extérieur qui bouge casse `main` sans qu'aucun
# commit n'y arrive. Il fait ce que le ruleset ne fait pas : rendre cet échec
# impossible à ignorer, et borner le temps pendant lequel `main` reste cassée
# sans que personne ne le sache.
#
# Ce qu'il protège vraiment :
#   - une CI rouge sur `main` ouvre une issue nominative, avec le job fautif et
#     le lien du journal ;
#   - l'issue se ferme d'elle-même au premier passage vert, donc sa présence
#     signifie toujours « `main` est cassée MAINTENANT » ;
#   - il couvre le cas que le hook local ne peut pas voir — trois défauts propres
#     à Linux ont été trouvés le 20/08/2026, tous invisibles sous Windows.
#
# Ce qu'il ne protège PAS, et qu'il ne faut pas croire :
#   - il n'empêche rien. Le code cassé est déjà sur `main` quand il s'exécute ;
#     l'empêchement, c'est le ruleset.
#   - une fusion forcée par l'administrateur (`--admin`) passe le ruleset ; le
#     gardien la verra seulement si la CI de `main` échoue ensuite.
#
# Décisions D29 (révisée le 28/09/2026) et D84.
name: Gardien de main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: gardien-main
  cancel-in-progress: false

jobs:
  garder:
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir ou fermer l'alerte selon l'état de main
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ID_RUN: ${{ github.event.workflow_run.id }}
          LIEN: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # L'issue ouverte, s'il y en a une. Le libellé garantit qu'on ne
          # touche jamais une issue écrite à la main.
          existante="$(gh issue list --repo "$DEPOT" \
            --label 'main-rouge' --state open --limit 1 --json number \
            --jq '.[0].number // empty')"

          # Une exécution ANNULÉE n'est pas une exécution rouge : la
          # concurrence de ci.yml annule l'exécution d'un commit dès qu'un
          # commit plus récent arrive sur main, et c'est ce dernier qui
          # jugera. Le 28/09/2026, trois fusions rapprochées ont ainsi ouvert
          # l'alerte #22 sans qu'aucun job n'ait échoué.
          if [ "$CONCLUSION" = "cancelled" ]; then
            echo "Exécution annulée par une plus récente : rien à signaler."
            exit 0
          fi

          if [ "$CONCLUSION" = "success" ]; then
            if [ -n "$existante" ]; then
              gh issue comment "$existante" --repo "$DEPOT" \
                --body "\`main\` est repassée au vert avec \`${SHA:0:7}\`. Journal : $LIEN"
              gh issue close "$existante" --repo "$DEPOT" --reason completed
              echo "Alerte #$existante fermée : main est verte."
            else
              echo "main est verte, aucune alerte à fermer."
            fi
            exit 0
          fi

          # Les jobs réellement en échec, pour que l'alerte dise QUOI est cassé
          # et pas seulement QUE quelque chose l'est. Un job « skipped » est
          # exclu : il n'a pas échoué, il n'a pas eu lieu.
          fautifs="$(gh run view "$ID_RUN" --repo "$DEPOT" --json jobs \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "- **\(.name)** : \(.conclusion)"' \
            || echo '- (liste des jobs indisponible)')"

          corps="$(printf '%s\n' \
            "La CI a échoué sur \`main\`." \
            "" \
            "| | |" \
            "|---|---|" \
            "| Commit | \`${SHA:0:7}\` |" \
            "| Journal | $LIEN |" \
            "" \
            "**Jobs en échec :**" \
            "" \
            "$fautifs" \
            "" \
            "---" \
            "" \
            "Cette alerte est ouverte automatiquement et **se ferme d'elle-même**" \
            "au premier passage vert de \`main\`. Tant qu'elle est ouverte, la" \
            "branche par défaut est cassée." \
            "" \
            "Ce dépôt est privé sur un compte GitHub Free : les règles de branche" \
            "n'y sont pas disponibles, donc rien n'a pu empêcher ce commit" \
            "d'atterrir. Voir la décision D29 de \`docs/decisions.md\`.")"

          if [ -n "$existante" ]; then
            gh issue comment "$existante" --repo "$DEPOT" --body "$corps"
            echo "Alerte #$existante mise à jour."
          else
            gh issue create --repo "$DEPOT" \
              --title "main est rouge" \
              --label 'main-rouge' \
              --body "$corps"
            echo "Alerte ouverte."
          fi
