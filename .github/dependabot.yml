version: 2

# Le délai de refroidissement (`cooldown`) est ce qui sépare une mise à jour
# d'une adoption aveugle. Sans lui, une version compromise publiée sur npm est
# proposée à la fusion dans l'heure : c'est le vecteur des attaques de chaîne
# d'approvisionnement, où le paquet légitime est remplacé par une version
# malveillante pendant quelques heures avant d'être retiré.
#
# Trouvé par semgrep (`dependabot-missing-cooldown`, quatre occurrences) à sa
# PREMIÈRE exécution en intégration continue, le 20/08/2026. Le plan du lot 1
# ne le prévoyait pas.
#
# Les durées sont graduées par le risque, pas uniformes : une majeure change des
# interfaces et mérite qu'on laisse le temps aux autres de rencontrer ses
# problèmes ; un correctif est ce qu'on veut recevoir vite.
#
# ⚠️ À vérifier avant de rallonger ces délais : `cooldown` s'applique aux mises
# à jour de VERSION. Les mises à jour de SÉCURITÉ déclenchées par une alerte
# Dependabot suivent un autre chemin — mais cela n'a pas été éprouvé ici, et un
# délai trop long retarderait un correctif de sécurité s'il l'était.
updates:
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      mineures:
        update-types: [minor, patch]

  # La racine porte elle aussi un package.json depuis le lot 1 — husky,
  # lint-staged. Sans ce bloc, l'outillage de dépôt ne serait jamais mis à jour,
  # et c'est lui qui s'exécute à chaque commit.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /back
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      mineures:
        update-types: [minor, patch]

  # Le bloc qu'on oublie ; c'est pourtant lui qui porte le risque d'exécution.
  # Les actions sont épinglées par empreinte dans ci.yml : sans Dependabot,
  # elles resteraient figées sur une version vulnérable, l'épinglage protégeant
  # de la substitution mais pas de l'obsolescence.
  #
  # `github-actions` ne supporte que `default-days` — vérifié dans la référence
  # des options Dependabot, les clés SemVer sont réservées aux écosystèmes qui
  # versionnent en SemVer.
  # `db/compose.yaml` porte le tag PostgreSQL, et c'est le SEUL endroit du dépôt
  # où il est écrit (D34). Sans ce bloc, l'image de la base locale resterait sur
  # une version figée pendant que les correctifs sortent — et la divergence
  # avec l'instance managée grandirait en silence, ce qu'une base locale existe
  # précisément pour empêcher.
  - package-ecosystem: docker-compose
    directory: /db
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

  # La démonstration de la racine — D83. `docker` suit les images du
  # `Dockerfile` (SDK et runtime .NET) ; `docker-compose` suit celle de Mailpit
  # dans `compose.yaml`. Le tag PostgreSQL n'y figure pas : il est ÉTENDU depuis
  # `db/compose.yaml`, que le bloc précédent suit déjà.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
