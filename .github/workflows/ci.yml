name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Les actions sont épinglées par EMPREINTE, jamais par étiquette : une étiquette
# est mutable, une empreinte ne l'est pas. Une action compromise puis repointée
# exécuterait du code arbitraire avec les secrets du dépôt. Le commentaire donne
# la version lisible ; l'empreinte fait foi. Relevées le 20/08/2026 par
# `gh api repos/<action>/git/ref/tags/<version>`.
jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      # `npm run test` embarque aujourd'hui les épreuves du harnais, dont celle
      # des secrets : gitleaks est donc un prérequis de ce job aussi, pas
      # seulement du job « securite ».
      - uses: ./.github/actions/installer-gitleaks
      - run: npm --prefix front ci
      - run: npm --prefix front run format:check
      - run: npm --prefix front run lint
      - run: npm --prefix front run lint:types
      - run: npm --prefix front run typecheck
      - run: npm --prefix front run test
      - run: npm --prefix front run knip
      - run: npm run lint:scripts
      - run: npm run format:scripts
      - run: npm run regles
      - run: npm --prefix front run build
      - run: npm --prefix front run jscpd
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore back/Palier.sln
      - run: dotnet build back/Palier.sln --no-restore
      - run: dotnet test back/Palier.sln --no-build --settings back/coverage.runsettings
      - run: dotnet format back/Palier.sln --verify-no-changes
      # `dotnet list package --vulnerable` sort en code 0 même quand il TROUVE
      # quelque chose : la commande brute est un affichage, pas un garde-fou.
      # C'est l'épreuve du harnais qui porte l'assertion sur la sortie — et,
      # en amont, l'audit NuGet promu en erreur par `TreatWarningsAsErrors`,
      # qui casse la restauration avant même que la commande ne tourne.
      - run: npm run audit:back

  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/installer-gitleaks
      - run: npm --prefix front ci
      - run: npm --prefix front audit --audit-level=high
      # La racine porte husky et lint-staged, qui s'exécutent à CHAQUE commit
      # sur le poste du développeur. Elles échappaient à l'audit, qui ne
      # regardait que `front/`. Une dépendance de hook compromise s'exécute au
      # moment le plus privilégié du cycle : juste avant que le code parte.
      - run: npm ci
      - run: npm audit --audit-level=high
      # `fetch-depth: 0` ci-dessus n'est pas décoratif : `gitleaks git` parcourt
      # l'HISTORIQUE, et un clone superficiel lui donnerait un commit à lire.
      - run: gitleaks git --redact --no-banner -v --config .gitleaks.toml .
      # semgrep est un outil Python. Le paquet `semgrep` du registre npm est un
      # embryon à la version 0.0.1, comme celui de gitleaks : `npx semgrep` ne
      # lancerait rien. `pipx` est préinstallé sur les images ubuntu-latest.
      - run: pipx install semgrep
      # L'exclusion des fixtures est portée par la COMMANDE, jamais par un
      # fichier de configuration — décision D20, quatre outils l'ont prouvée.
      - run: >-
          semgrep --config=p/owasp-top-ten --error --quiet
          --exclude=front/tests/harness/fixtures
          --exclude=back/tests-harness/fixtures
          .
      - run: node scripts/verifier-licences.mjs
      # D30 : `.github/dependabot.yml` était JUSTE et ne servait à RIEN, parce
      # que la fonctionnalité qu'il paramètre était désactivée en amont. Une
      # épreuve verte lisait un fichier correct pendant vingt-quatre heures.
      # Cette étape interroge l'ÉTAT DU SERVICE, pas le fichier.
      #
      # ⚠️ LIMITE MESURÉE le 20/08/2026, à la source et non de mémoire.
      # `GET /repos/…/vulnerability-alerts` et `/automated-security-fixes`
      # exigent la permission fine « Administration: read ». Cette permission
      # N'EXISTE PAS parmi les clés que `permissions:` accepte pour
      # GITHUB_TOKEN, et l'application Actions dont ce jeton est issu ne peut
      # pas la recevoir : l'appel rend 403 « Resource not accessible by
      # integration » même sous `write-all`.
      # Il faut donc un jeton à granularité fine portant « Administration:
      # read », déposé en secret de dépôt sous le nom JETON_ETAT_DEPENDABOT.
      # Sans lui, cette étape ÉCHOUE — délibérément, et en disant quoi faire.
      # Le contrôle n'est pas abandonné : il devient une vérification manuelle
      # inscrite à `docs/gabarit-rapport-lot.md`, avec ses deux commandes.
      - name: Le service Dependabot est-il réellement allumé ?
        env:
          JETON: ${{ secrets.JETON_ETAT_DEPENDABOT || secrets.GITHUB_TOKEN }}
          JETON_DEDIE: ${{ secrets.JETON_ETAT_DEPENDABOT != '' }}
          DEPOT: ${{ github.repository }}
        run: |
          set -u

          # Tant que le secret dédié n'existe pas, ce contrôle NE PEUT PAS
          # s'exécuter : GITHUB_TOKEN rend 403, quoi qu'on déclare dans
          # `permissions:`. Le faire échouer laisserait `main` rouge en
          # permanence — et une CI rouge en permanence cesse d'être lue, ce qui
          # coûte plus que le contrôle ne rapporte.
          #
          # L'étape signale donc bruyamment, et ne bloque pas. La distinction
          # qui compte est écrite dans le message : « je n'ai pas pu vérifier »
          # n'est pas « c'est allumé ». La vérification manuelle reste inscrite
          # au gabarit de rapport de lot, avec ses deux commandes.
          #
          # Dès que le secret existe, `JETON_DEDIE` passe à `true` et l'étape
          # redevient bloquante sans qu'on touche à ce fichier.
          if [ "${JETON_DEDIE}" != "true" ]; then
            echo "::warning::Le secret JETON_ETAT_DEPENDABOT est absent : l'état du service Dependabot N'A PAS ÉTÉ VÉRIFIÉ. Ce n'est pas un feu vert."
            echo "Pour l'activer : jeton à granularité fine avec « Administration: read », déposé en secret de dépôt sous ce nom."
            echo "En attendant, vérification manuelle à porter au rapport de lot :"
            echo "  gh api -i repos/$DEPOT/vulnerability-alerts      # attendu : HTTP 204"
            echo "  gh api repos/$DEPOT/automated-security-fixes     # attendu : {\"enabled\":true,\"paused\":false}"
            exit 0
          fi
          # Fichier de réponse UNIQUE, jamais un chemin fixe : deux étapes
          # concurrentes se marcheraient dessus, et un `/tmp` partagé rend le
          # résultat dépendant de ce qui traînait avant.
          reponse="$(mktemp)"
          trap 'rm -f "$reponse"' EXIT

          appel() {
            curl -sS -o "$reponse" -w '%{http_code}' \
              -H "Authorization: Bearer $JETON" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$DEPOT/$1"
          }

          echec=0

          code=$(appel vulnerability-alerts)
          case "$code" in
            204) echo "alertes Dependabot : ACTIVES" ;;
            404) echo "::error::Les alertes Dependabot sont ÉTEINTES (404 sur vulnerability-alerts), ou le jeton n'a pas « Administration: read ». Les deux se ressemblent : relancer la commande manuelle ci-dessous pour trancher."; echec=1 ;;
            403) echo "::error::403 sur vulnerability-alerts : le jeton n'a pas « Administration: read ». GITHUB_TOKEN ne peut PAS l'avoir — déposer un jeton fin en secret JETON_ETAT_DEPENDABOT."; echec=1 ;;
            *)   echo "::error::Réponse inattendue ($code) sur vulnerability-alerts :"; cat "$reponse"; echec=1 ;;
          esac

          code=$(appel automated-security-fixes)
          if [ "$code" = "200" ]; then
            # Le code de sortie de node est examiné SÉPARÉMENT du verdict.
            # Sans cela, un plantage du parseur rendait une chaîne vide, que la
            # branche suivante lisait comme « service éteint » : un contrôle
            # cassé se déguisait en verdict. Mesuré le 20/08/2026 en lançant
            # cette étape, pas en la relisant.
            if actif=$(node -e '
              const o = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
              console.log(o.enabled === true && o.paused !== true ? "oui" : "non")
            ' "$reponse"); then
              case "$actif" in
                oui) echo "correctifs automatiques : ACTIFS" ;;
                non) echo "::error::Les correctifs automatiques Dependabot sont ÉTEINTS ou EN PAUSE :"; cat "$reponse"; echec=1 ;;
                *)   echo "::error::Verdict illisible (« $actif ») : le contrôle est cassé, ce n'est PAS un service éteint."; echec=1 ;;
              esac
            else
              echo "::error::La lecture de la réponse a échoué : le contrôle est cassé, ce n'est PAS un service éteint."
              cat "$reponse"
              echec=1
            fi
          else
            echo "::error::Réponse inattendue ($code) sur automated-security-fixes — voir la limite ci-dessus."
            cat "$reponse"
            echec=1
          fi

          if [ "$echec" -ne 0 ]; then
            echo "Vérification manuelle, à porter au rapport de lot :"
            echo "  gh api -i repos/$DEPOT/vulnerability-alerts      # attendu : HTTP 204"
            echo "  gh api repos/$DEPOT/automated-security-fixes     # attendu : {\"enabled\":true,\"paused\":false}"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm --prefix front ci
      - run: npm --prefix front run e2e:install
      - run: npm --prefix front run e2e

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm --prefix front ci
      - run: npm --prefix front run build
      # Lighthouse CI n'est PAS une dépendance déclarée du front — décision D27.
      # Sa chaîne transitive (puppeteer-core, @puppeteer/browsers, extract-zip)
      # porte sept avis de sévérité haute dont un SANS version corrigée : le
      # déclarer ferait échouer `npm audit --audit-level=high` du job
      # « securite », ou obligerait à abaisser ce seuil. Il est donc installé de
      # façon éphémère, à version figée, dans le seul job qui le mesure.
      - run: npx --yes @lhci/cli@0.15.1 autorun
        working-directory: front

  franchissement:
    needs: [front, backend, securite, e2e, performance]
    # `needs:` SEUL fait sauter ce job quand un amont échoue : il apparaît GRIS,
    # et un job gris se lit comme « pas concerné ». D29 rappelle qu'aucune
    # barrière côté serveur n'existe — GitHub Free ne donne ni branches
    # protégées ni rulesets sur un dépôt privé. Ce job est ce qui DEVRAIT dire
    # « les garde-fous ont tourné » ; gris, une fusion passe sans qu'aucune
    # épreuve de franchissement n'ait tourné.
    #
    # `always()` le fait tourner quoi qu'il arrive ; la première étape ci-dessous
    # le fait ÉCHOUER. Les deux sont nécessaires : `always()` seul rendrait le
    # job VERT après un échec amont, ce qui est pire que gris.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Les cinq jobs amont ont-ils réussi ?
        # Chaque résultat est nommé : « un job amont a échoué » sans nom oblige
        # à rouvrir l'interface pour savoir lequel.
        run: |
          echo "front=${{ needs.front.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "securite=${{ needs.securite.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "performance=${{ needs.performance.result }}"
          echec=0
          for couple in \
            "front:${{ needs.front.result }}" \
            "backend:${{ needs.backend.result }}" \
            "securite:${{ needs.securite.result }}" \
            "e2e:${{ needs.e2e.result }}" \
            "performance:${{ needs.performance.result }}"; do
            nom="${couple%%:*}"
            etat="${couple#*:}"
            if [ "$etat" != "success" ]; then
              echo "::error::Le job « $nom » n'a pas réussi : $etat"
              echec=1
            fi
          done
          if [ "$echec" -ne 0 ]; then
            echo "Le franchissement ÉCHOUE parce qu'un garde-fou amont n'a pas tourné."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/installer-gitleaks
      - run: npm --prefix front ci
      # Les épreuves de `tests-harness/` importent `yaml`, déclaré dans le
      # `package.json` de la RACINE. Sans cette installation, elles échouent sur
      # ERR_MODULE_NOT_FOUND — invisible en local, où `node_modules/` existe
      # depuis longtemps. Troisième divergence entre le poste de développement
      # et l'intégration continue trouvée sur ce lot, après le périmètre de
      # gitleaks et le vidage de stdout.
      - run: npm ci
      - run: npm --prefix front run e2e:install
      - name: La CI n'appelle-t-elle que verify en local ?
        run: grep -q 'npm run verify' .husky/pre-push
      - name: Les garde-fous refusent-ils encore ?
        run: npm run test:harness
